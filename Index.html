<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRK Platform</title>

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f1f5f9;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
    }

    .card{
      background:white;
      padding:40px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
      max-width:500px;
      width:90%;
      text-align:center;
    }

    h1{
      margin-bottom:10px;
    }

    p{
      color:#555;
      line-height:1.5;
    }

    .btn{
      display:inline-block;
      margin-top:20px;
      padding:14px 24px;
      background:black;
      color:white;
      border-radius:12px;
      text-decoration:none;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>MRK Administratie Platform</h1>

    <p>
      Werkbonnen, urenregistratie,
      offertes en facturen voor
      MRK Aannemersbedrijf.
    </p>

    <a class="btn" href="#">
      Platform actief
    </a>
  </div>

</body>
</html>
